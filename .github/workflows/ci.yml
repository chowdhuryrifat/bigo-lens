name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '18'

jobs:
  native-linux:
    name: Native · Ubuntu · Clang frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and Clang development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev libclang-${LLVM_VERSION}-dev \
            libclang-cpp${LLVM_VERSION}-dev libpolly-${LLVM_VERSION}-dev \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev libcurl4-openssl-dev
      - name: Configure
        run: >-
          cmake --preset ci -G Ninja
          -DClang_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/clang
          -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci
      - name: Engine smoke check
        run: ./build/ci/engine/bigolens-engine --request shared/examples/capabilities.request.json
      - name: Upload engine for the extension job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigolens-engine-linux
          path: build/ci/engine/bigolens-engine
          retention-days: 3
          if-no-files-found: error

  native-core:
    name: Native · ${{ matrix.os }} · core (no Clang frontend)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset no-clang
      - name: Build
        run: cmake --build --preset no-clang --parallel
      - name: Test
        run: ctest --preset no-clang

  native-macos-clang:
    # Experimental: building against Homebrew LLVM is not yet a supported configuration.
    name: Native · macOS · Clang frontend (experimental)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LLVM
        run: brew install llvm@${LLVM_VERSION} ninja
      - name: Configure
        run: |
          prefix="$(brew --prefix llvm@${LLVM_VERSION})"
          cmake --preset dev -G Ninja \
            -DCMAKE_CXX_COMPILER="$prefix/bin/clang++" \
            -DClang_DIR="$prefix/lib/cmake/clang" -DLLVM_DIR="$prefix/lib/cmake/llvm"
      - name: Build
        run: cmake --build --preset dev --parallel
      - name: Test
        run: ctest --preset dev

  extension:
    name: Extension · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:schemas
      - run: npm test

  extension-integration:
    name: Extension · integration with native engine
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang runtime libraries and headers used by the engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-${LLVM_VERSION} libclang-cpp${LLVM_VERSION} xvfb
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigolens-engine-linux
          path: ${{ runner.temp }}/engine
      - run: chmod +x "${{ runner.temp }}/engine/bigolens-engine"
      - run: npm ci
      - name: Integration tests against the real engine
        run: npm run test:integration
        env:
          BIGOLENS_ENGINE_PATH: ${{ runner.temp }}/engine/bigolens-engine
      - name: VS Code extension-host smoke test
        run: xvfb-run -a npm run test:vscode

  package-linux:
    name: Package · self-contained Linux .vsix
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and Clang development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev libclang-${LLVM_VERSION}-dev \
            libclang-cpp${LLVM_VERSION}-dev libpolly-${LLVM_VERSION}-dev \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev libcurl4-openssl-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the statically linked engine and package the extension
        run: >-
          scripts/build/package-extension.sh -G Ninja
          -DClang_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/clang
          -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm
      - name: Verify the .vsix (clean container, VS Code with the bundled engine)
        run: xvfb-run -a scripts/test/verify-vsix.sh extension/bigo-lens.vsix
      - name: Report package size
        run: ls -l extension/bigo-lens.vsix | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigo-lens-vsix-linux-x64
          path: extension/bigo-lens.vsix
          retention-days: 14
          if-no-files-found: error
