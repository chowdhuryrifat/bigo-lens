name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0). Creates a draft release.
        required: true

permissions:
  contents: read

env:
  LLVM_VERSION: '18'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Check that the tag matches the CMake and extension versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"; exit 1
          fi
          version="${TAG#v}"
          cmake_version="$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)"
          ext_version="$(node -p "require('./extension/package.json').version")"
          if [[ "$cmake_version" != "$version" || "$ext_version" != "$version" ]]; then
            echo "::error::tag $version != CMake $cmake_version / extension $ext_version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build & package · ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            binary_name: bigolens-engine
          - target: win32-x64
            os: windows-2022
            binary_name: bigolens-engine.exe
          - target: darwin-arm64
            os: macos-latest
            binary_name: bigolens-engine
          - target: darwin-x64
            os: macos-13
            binary_name: bigolens-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev libclang-${LLVM_VERSION}-dev \
            libclang-cpp${LLVM_VERSION}-dev libpolly-${LLVM_VERSION}-dev \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev libcurl4-openssl-dev

      - name: Build engine (Linux static package)
        if: runner.os == 'Linux'
        run: |
          scripts/build/package-extension.sh -G Ninja \
            -DClang_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm
          (cd extension && npm run lint && npm test)

      - name: Build engine (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --bin bigolens-engine
          mkdir -p extension/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/bigolens-engine.exe extension/bin/
          else
            cp target/release/bigolens-engine extension/bin/
            chmod 0755 extension/bin/bigolens-engine
          fi

      - name: Build extension and package platform VSIX (BL-603)
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cd extension
          npm ci
          npm run compile
          npx @vscode/vsce package --target "$TARGET" --out "../dist/bigo-lens-$VERSION-$TARGET.vsix"

      - name: Verify the Linux .vsix
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: xvfb-run -a scripts/test/verify-vsix.sh "dist/bigo-lens-$VERSION-linux-x64.vsix"

      - name: Verify the Windows / macOS .vsix
        if: runner.os != 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: SKIP_CONTAINER=1 SKIP_VSCODE=1 scripts/test/verify-vsix.sh "dist/bigo-lens-$VERSION-$TARGET.vsix"

      - name: Assemble standalone engine archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            tar -C extension/bin -czf "dist/bigolens-engine-$VERSION-$TARGET.tar.gz" .
            powershell -Command "Compress-Archive -Path extension/bin/* -DestinationPath dist/bigolens-engine-$VERSION-$TARGET.zip" || true
          else
            tar -C extension/bin -czf "dist/bigolens-engine-$VERSION-$TARGET.tar.gz" .
          fi

      - name: Upload artifacts for target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release & Provenance (BL-604)
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 Checksums (BL-604)
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate build provenance attestations (BL-604)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "BigO Lens $TAG" --generate-notes --verify-tag)
          [[ "$DRAFT" == "true" ]] && flags+=(--draft)
          gh release create "$TAG" dist/* "${flags[@]}"

      - name: Upload aggregated release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-release-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    name: Marketplace & Open VSX Publication (BL-605)
    needs: [validate, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-release-artifacts
          path: dist
      - name: Publish to Visual Studio Marketplace & Open VSX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ] && [ -z "$OVSX_PAT" ]; then
            echo "::warning::Neither VSCE_PAT nor OVSX_PAT is configured; skipping publication."
            exit 0
          fi
          for vsix in dist/*.vsix; do
            echo "Publishing package $vsix..."
            if [ -n "$VSCE_PAT" ]; then
              npx --yes @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT"
            else
              echo "::warning::VSCE_PAT not provided; skipping Visual Studio Marketplace for $vsix."
            fi
            if [ -n "$OVSX_PAT" ]; then
              npx --yes ovsx publish --packagePath "$vsix" -p "$OVSX_PAT"
            else
              echo "::warning::OVSX_PAT not provided; skipping Open VSX for $vsix."
            fi
          done
