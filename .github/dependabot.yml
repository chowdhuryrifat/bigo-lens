version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node type definitions must match the minimum supported tooling runtime (Node 22); bump together with engines.node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # The minimum supported VS Code version is a product decision, not a dependency update.
      - dependency-name: '@types/vscode'
        update-types: [version-update:semver-major, version-update:semver-minor]
