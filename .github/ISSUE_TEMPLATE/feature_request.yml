name: Feature request
description: Suggest a new analysis, constraint type, UI improvement or workflow.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For analysis features, describe which code patterns should be recognised and what result is technically justified.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example C++ code and constraints
      render: cpp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: The feature does not require reporting results that cannot be supported (unknown / unsupported remain possible outcomes)
          required: true
        - label: The feature does not depend on a specific competitive-programming platform or a mandatory online service
          required: true
