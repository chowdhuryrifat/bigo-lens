[workspace]
members = [
    "crates/bigolens-core",
    "crates/bigolens-syntax",
    "crates/bigolens-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BigO Lens Contributors"]
license = "Apache-2.0"
repository = "https://github.com/rifz/bigo-lens"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-cpp = "0.23"
